<html>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
    <canvas id="unimap">
    </canvas>
    <script>
        env.DB.prepare("CREATE TABLE IF NOT EXISTS logger (posX int, posY int, logged bool, timestamp int);")
        const canvas = document.getElementById("unimap");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        function reize(){
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

        }
        window.addEventListener('resize', reize);
    </script>
</html>
